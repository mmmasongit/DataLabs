services:
  mysql:
    build:
      context: .
      dockerfile: mysql.dockerfile
    container_name: datalabs_mysql
    environment:
      MYSQL_DATABASE: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_USER: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql:/var/lib/mysql
  postgres:
    build:
      context: .
      dockerfile: postgres.dockerfile
    container_name: datalabs_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  mysql:
  postgres: