[project]
dependencies = [
  "matplotlib>=3.11.1",
  "numpy>=2.5.1",
  "pandas>=3.0.3",
  "psycopg2-binary>=2.9.12",
  "seaborn>=0.13.2",
  "sqlalchemy>=2.0.51",
  "toml>=0.10.2",
]
name = "datalabs"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "ipython-sql>=0.5.0",
  "jupysql>=0.11.1",
  "ruff>=0.15.22",
]

[tool.jupysql.SqlMagic]
displaycon = false
displaylimit = 0
